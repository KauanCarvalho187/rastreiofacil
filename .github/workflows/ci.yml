name: CI

# Roda os testes que NAO precisam de rede:
#  - test_analise_erros.py : verificacao estatica (regressoes de codigo/HTML/JS)
#  - pytest                : suite em tests/ (API in-process + rastreio)
# O job "navegador" roda os testes de Selenium (Chrome headless) do fluxo da interface.
# Para rodar os testes de navegador localmente: pytest --browser

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Verificacao estatica
        run: python test_analise_erros.py
      - name: Suite pytest
        run: python -m pytest

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes de navegador (Chrome headless)
        run: python -m pytest --browser -q
